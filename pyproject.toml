[project]
name = "forex-currency-trading"
version = "0.2.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "ccxt>=4.5.61",
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "metatrader5>=5.0.5735 ; sys_platform == 'win32'",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tables>=3.11.1",
    "yfinance>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx", "old_packages"]
